<!doctype html>
<html lang="ru">
<head>
   <meta charset="UTF-8"/>
   <title>{% block title %}SportClub{% endblock %}</title>
   <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

<header class="bg-white shadow-md sticky top-0 z-50">
   <nav class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">

       <a href=""
          class="flex items-center gap-2 text-2xl font-bold text-blue-600 hover:text-blue-700 transition duration-200">
           <span class="text-3xl">🏋️</span>
           <span>SportClub</span>
       </a>

       <div class="flex items-center gap-2 sm:gap-3">
           <a href=""
              class="px-3 py-2 text-sm font-medium text-gray-700 hover:text-blue-600 transition duration-200">
               Главная
           </a>

           {% if user.is_authenticated %}
           <a href=""
              class="px-3 py-2 text-sm font-medium text-gray-700 hover:text-blue-600 transition duration-200">
               Личный кабинет
           </a>
           <span class="hidden sm:inline text-sm text-gray-500">
                       {{ user.username }}
                   </span>
           <a href=""
              class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm font-semibold rounded-lg transition duration-200">
               Выход
           </a>
           {% else %}
           <a href=""
              class="px-4 py-2 text-sm font-semibold text-blue-600 hover:text-blue-700 transition duration-200">
               Войти
           </a>
           <a href=""
              class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition duration-200">
               Регистрация
           </a>
           {% endif %}
       </div>
   </nav>
</header>

{% if messages %}
<div class="max-w-6xl mx-auto w-full px-4 pt-4 space-y-2">
   {% for message in messages %}
   <div class="px-4 py-3 rounded-lg border
                   {% if message.tags == 'success' %}bg-green-100 border-green-300 text-green-800
                   {% elif message.tags == 'error' %}bg-red-100 border-red-300 text-red-700
                   {% else %}bg-blue-100 border-blue-300 text-blue-700{% endif %}">
       {{ message }}
   </div>
   {% endfor %}
</div>
{% endif %}

<main class="flex-1">
   {% block content %}
   {% endblock %}
</main>

<footer class="bg-white border-t border-gray-200 mt-12">
   <div class="max-w-6xl mx-auto px-4 py-6 text-center text-sm text-gray-500">
       © 2026 SportClub. Все права защищены.
   </div>
</footer>

</body>
</html>
