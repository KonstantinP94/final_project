{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Верхняя панель с авторизацией -->
    <div class="flex justify-between items-center p-4 bg-gray-100 shadow">
        <div class="text-lg font-semibold">Мой сайт</div>
        <div>
            {% if user.is_authenticated %}
                <span class="mr-4">Привет, {{ user.username }}!</span>
                <a href="{% url 'users:logout' %}" class="text-red-600 hover:underline">Выйти</a>
            {% else %}
                <a href="{% url 'users:login' %}" class="text-blue-600 hover:underline mr-3">Войти</a>
                <a href="{% url 'users:register' %}" class="text-blue-600 hover:underline">Регистрация</a>
            {% endif %}
        </div>
    </div>

    <!-- Блок для вывода сообщений (Django messages) -->
    {% if messages %}
        <div class="messages-container max-w-4xl mx-auto mt-4 px-4">
            {% for message in messages %}
                <div class="p-3 mb-2 rounded
                    {% if message.tags == 'success' %}bg-green-100 text-green-700 border border-green-300
                    {% elif message.tags == 'error' %}bg-red-100 text-red-700 border border-red-300
                    {% elif message.tags == 'warning' %}bg-yellow-100 text-yellow-700 border border-yellow-300
                    {% else %}bg-blue-100 text-blue-700 border border-blue-300{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Основной контент -->
    <main class="container mx-auto p-4">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
