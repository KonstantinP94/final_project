{% extends 'layout.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4">
    <div class="w-full max-w-md bg-white shadow-lg rounded-xl p-8">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
            Вход
        </h1>

        <form method="post" class="space-y-5">
            {% csrf_token %}

            {% if form.non_field_errors %}
            <div class="bg-red-100 border border-red-300 text-red-700 px-4 py-3 rounded">
                {{ form.non_field_errors }}
            </div>
            {% endif %}

            {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                <div class="mt-1 text-sm text-red-600">
                    {{ field.errors }}
                </div>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200">
                Войти
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            Нет аккаунта?
            <a href="{% url 'users:register' %}" class="text-blue-600 hover:text-blue-800 font-medium">
                Зарегистрироваться
            </a>
        </div>
    </div>
</div>
{% endblock %}
